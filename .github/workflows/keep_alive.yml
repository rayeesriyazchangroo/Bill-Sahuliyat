name: Keep Render App Awake

on:
  schedule:
    # Triggers every 10 minutes to keep Render web service continuously awake
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Route
        run: |
          # Replace with your Render URL or set RENDER_APP_URL in GitHub Repository Secrets
          APP_URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$APP_URL" ]; then
            APP_URL="https://bill-sahuliyat-yvti.onrender.com/up"
          fi
          echo "Pinging: $APP_URL"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL")
          echo "HTTP Response Status: $RESPONSE"
          if [ "$RESPONSE" -ne 200 ]; then
            echo "❌ Health check failed with status: $RESPONSE"
            exit 1
          else
            echo "✅ Health check passed"
          fi
